# domotique.conf - Configuration nginx du Projet Domotique
#
# Emplacement dans le dépôt : ~/projet-domotique/nginx/domotique.conf
# Activé par un lien dans /etc/nginx/sites-enabled/ (voir README).
#
#   http://192.168.56.10/          -> fichiers du dossier front/ (index.html = page de login)
#   http://192.168.56.10/api/...   -> serveur C sur le port 8080 (réponses JSON)

server {
    listen 80 default_server;       # port HTTP ; ce site répond par défaut
    server_name _;                  # n'importe quel nom ou adresse (192.168.56.10...)

    # --- Site web : fichiers statiques ---
    root /home/raph/projet-domotique/front;   # seul chemin à adapter sur le Raspberry Pi
    index index.html;                         # page servie quand on demande "/"

    location / {
        # le fichier demandé, sinon le dossier, sinon erreur 404
        try_files $uri $uri/ =404;
    }

    # --- API : transmise au serveur C ---
    location /api/ {
        # pas de "/" après 8080 : le serveur C reçoit le chemin complet (/api/login)
        proxy_pass http://127.0.0.1:8080;

        # informations utiles au serveur C sur le navigateur d'origine
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}