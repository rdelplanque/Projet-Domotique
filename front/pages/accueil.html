<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R-Domotik – Accueil</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/pages.css">
    <!-- defer : exécutés dans cet ordre, une fois la page lue -->
    <script src="/js/session.js" defer></script>
    <script src="/js/commun.js" defer></script>
</head>

<body class="page-accueil" data-page="accueil">

    <!-- Rempli par commun.js -->
    <header class="entete"></header>

    <main class="contenu">

        <!-- Icônes : une image par carte (logo.jpg en attendant les vraies).
             Chaque carte est cachée (hidden) ; commun.js montre celles
             dont le data-droit est dans la liste donnée par /api/moi. -->
        <section class="groupe">
            <h2 class="groupe-titre">La maison</h2>
            <div class="cartes">
                <a class="carte" href="/pages/maison.html" data-droit="consulter" hidden>
                    <img class="carte-icone" src="/images/logo.jpg" alt="">
                    <span class="carte-nom">Ma maison</span>
                </a>
                <a class="carte" href="/pages/scenarios.html" data-droit="scenarios" hidden>
                    <img class="carte-icone" src="/images/logo.jpg" alt="">
                    <span class="carte-nom">Scénarios</span>
                </a>
                <a class="carte" href="/pages/statistiques.html" data-droit="statistiques" hidden>
                    <img class="carte-icone" src="/images/logo.jpg" alt="">
                    <span class="carte-nom">Statistiques</span>
                </a>
            </div>
        </section>

        <section class="groupe">
            <h2 class="groupe-titre">Administration</h2>
            <div class="cartes">
                <a class="carte" href="/pages/utilisateurs.html" data-droit="utilisateurs" hidden>
                    <img class="carte-icone" src="/images/logo.jpg" alt="">
                    <span class="carte-nom">Utilisateurs</span>
                </a>
                <a class="carte" href="/pages/configuration.html" data-droit="configuration" hidden>
                    <img class="carte-icone" src="/images/logo.jpg" alt="">
                    <span class="carte-nom">Configuration</span>
                </a>
            </div>
        </section>

        <section class="groupe">
            <h2 class="groupe-titre">Aide</h2>
            <div class="cartes">
                <a class="carte" href="/pages/aide.html" data-droit="aide" hidden>
                    <img class="carte-icone" src="/images/logo.jpg" alt="">
                    <span class="carte-nom">Manuel et à propos</span>
                </a>
            </div>
        </section>

    </main>

    <footer class="pied">Conçu par Raphael - ESGI B2 - 2026/2027</footer>

</body>
</html>
